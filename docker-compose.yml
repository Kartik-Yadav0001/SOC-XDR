# SentinelX — Enterprise SOC & XDR Platform
# Docker Compose for local development laboratory

services:
  postgres:
    image: postgres:16-alpine
    container_name: sentinelx-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: sentinelx
      POSTGRES_USER: sentinelx
      POSTGRES_PASSWORD: SentinelX!DB2026
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinelx"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - sentinelx_network

  redis:
    image: redis:7-alpine
    container_name: sentinelx-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - sentinelx_network

  opensearch:
    image: opensearchproject/opensearch:2.12.0
    container_name: sentinelx-opensearch
    ports:
      - "9200:9200"
      - "9600:9600"
    environment:
      discovery.type: single-node
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: OpenSearch!2026
      plugins.security.disabled: "true"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200/_cluster/health"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: always
    networks:
      - sentinelx_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sentinelx-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://sentinelx:SentinelX!DB2026@postgres:5432/sentinelx
      REDIS_URL: redis://redis:6379/0
      OPENSEARCH_URL: http://opensearch:9200
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-in-production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret-change-in-production}
      CORS_ORIGINS: http://localhost:3000,http://localhost:8080
      ENVIRONMENT: development
      DEMO_MODE: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    volumes:
      - ./backend:/app
    restart: unless-stopped
    networks:
      - sentinelx_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sentinelx-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - sentinelx_network

  nginx:
    image: nginx:alpine
    container_name: sentinelx-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    networks:
      - sentinelx_network

  prometheus:
    image: prom/prometheus:latest
    container_name: sentinelx-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    restart: unless-stopped
    networks:
      - sentinelx_network

  grafana:
    image: grafana/grafana:latest
    container_name: sentinelx-grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-Grafana!2026}
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - sentinelx_network

volumes:
  postgres_data:
  opensearch_data:
  grafana_data:

networks:
  sentinelx_network:
    driver: bridge